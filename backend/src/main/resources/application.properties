spring.application.name=date-course

# 프로젝트 폴더(backend/)의 .env 를 읽는다 (같은 이름의 OS 환경변수가 있으면 그 값이 우선)
spring.config.import=optional:file:.env[.properties]

# 환경변수 PORT가 있으면 그 포트로, 없으면 18290 (힐링룸 18280 과 같은 서버를 쓰므로 겹치지 않게)
server.port=${PORT:18290}
# 에러 응답에 스택 트레이스(서버 내부 정보)를 넣지 않는다
server.error.include-stacktrace=never

# ===== PostgreSQL =====
# 힐링룸과 같은 DB·계정을 쓰고, 이 앱은 date_course 스키마만 본다 (힐링룸 테이블은 public)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA:date_course}&reWriteBatchedInserts=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA =====
# 실행 시 DB를 절대 만들거나 바꾸지 않는다. validate 는 엔티티와 테이블이 맞는지 확인만 한다.
# 스키마 변경은 db/ 폴더의 SQL 을 직접 실행한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:date_course}
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# ===== 장소 수집 (외부 API 키) =====
# 비워 두면 그 출처만 수집하지 않는다. 키는 서버에서만 쓰고 화면(브라우저)에는 보내지 않는다
# 상가(상권)정보는 API 가 아니라 공공데이터포털에서 분기마다 받는 CSV 파일이라 키가 없다
date-course.tour.base-url=${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
date-course.tour.service-key=${TOUR_API_SERVICE_KEY:}
