spring.application.name=date-course

# 프로젝트 폴더(backend/)의 .env 를 읽는다 (같은 이름의 OS 환경변수가 있으면 그 값이 우선)
spring.config.import=optional:file:.env[.properties]

# 환경변수 PORT가 있으면 그 포트로, 없으면 18290 (힐링룸 18280 과 같은 서버를 쓰므로 겹치지 않게)
server.port=${PORT:18290}
# 에러 응답에 스택 트레이스(서버 내부 정보)를 넣지 않는다
server.error.include-stacktrace=never

# ===== PostgreSQL =====
# 힐링룸과 같은 DB·계정을 쓰고, 이 앱은 date_course 스키마만 본다 (힐링룸 테이블은 public)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA:date_course}&reWriteBatchedInserts=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA =====
# 실행 시 DB를 절대 만들거나 바꾸지 않는다. validate 는 엔티티와 테이블이 맞는지 확인만 한다.
# 스키마 변경은 db/ 폴더의 SQL 을 직접 실행한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:date_course}
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# ===== Redis (캐시) =====
# 힐링룸과 같은 Redis·계정. 이 계정은 healing-room: 로 시작하는 키만 쓸 수 있어 접두어를 healing-room:date-course: 로 둔다
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:1}
spring.data.redis.timeout=3s
date-course.redis.key-prefix=${REDIS_KEY_PREFIX:healing-room:date-course:}

# ===== 장소 수집 (외부 API 키) =====
# 비워 두면 그 출처만 수집하지 않는다. 키는 서버에서만 쓰고 화면(브라우저)에는 보내지 않는다
# 상가(상권)정보는 API 가 아니라 공공데이터포털에서 분기마다 받는 CSV 파일이라 키가 없다
date-course.tour.base-url=${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
date-course.tour.service-key=${TOUR_API_SERVICE_KEY:}

# 네이버 클라우드 Maps Geocoding (주소 -> 좌표, 서버에서만). 키가 없으면 주소 검색만 꺼진다
date-course.naver.geocode-url=${NAVER_GEOCODE_URL:https://maps.apigw.ntruss.com/map-geocode/v2/geocode}
date-course.naver.client-id=${NAVER_MAP_CLIENT_ID:}
date-course.naver.client-secret=${NAVER_MAP_CLIENT_SECRET:}
# 무료 이용량(월 3,000,000건)을 넘지 않게 사이트 전체 하루 한도
date-course.naver.geocode-daily-limit=${NAVER_GEOCODE_DAILY_LIMIT:3000}
# NAVER API HUB 지역 검색 (가게 이름 → 업체, 서버에서만). 키가 없으면 "네이버에서 찾기"만 꺼진다
date-course.naver.search-url=${NAVER_SEARCH_URL:https://naverapihub.apigw.ntruss.com/search/v1/local}
date-course.naver.search-client-id=${NAVER_SEARCH_CLIENT_ID:}
date-course.naver.search-client-secret=${NAVER_SEARCH_CLIENT_SECRET:}
# 무료 한도(하루 25,000건, 월 775,000건) 안에서 사이트 전체 하루 한도
date-course.naver.search-daily-limit=${NAVER_SEARCH_DAILY_LIMIT:20000}
