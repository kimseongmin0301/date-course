spring.application.name=date-course

# 프로젝트 폴더(backend/)의 .env 를 읽는다 (같은 이름의 OS 환경변수가 있으면 그 값이 우선)
spring.config.import=optional:file:.env[.properties]

# 환경변수 PORT가 있으면 그 포트로, 없으면 18290 (힐링룸 18280 과 같은 서버를 쓰므로 겹치지 않게)
server.port=${PORT:18290}
# 에러 응답에 스택 트레이스(서버 내부 정보)를 넣지 않는다
server.error.include-stacktrace=never

# ===== 장소 수집 (외부 API 키) =====
# 비워 두면 그 출처만 수집하지 않는다. 키는 서버에서만 쓰고 화면(브라우저)에는 보내지 않는다
date-course.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
date-course.naver.client-id=${NAVER_CLIENT_ID:}
date-course.naver.client-secret=${NAVER_CLIENT_SECRET:}
date-course.tour.service-key=${TOUR_API_SERVICE_KEY:}
