plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.datecourse'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	runtimeOnly 'org.postgresql:postgresql'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		// CI 에서는 실제 DB 가 없으므로 통합 테스트(@Tag("integration"))를 뺀다: ./gradlew test -Pci
		if (project.hasProperty('ci')) {
			excludeTags 'integration'
		}
	}
}

// 화면(frontend 의 npm run build 결과 dist/)을 jar 의 static 으로 넣어 서버 하나로 배포한다.
// dist 가 없으면(화면을 빌드하지 않았으면) 그냥 빈 채로 넘어간다. CI 는 화면을 먼저 빌드한다
tasks.named('processResources') {
	from('../frontend/dist') {
		into 'static'
	}
}

// 배포 스크립트가 찾기 쉽게 jar 이름을 버전 없이
tasks.named('bootJar') {
	archiveFileName = 'date-course.jar'
}
