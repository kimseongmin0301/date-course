# /etc/nginx/sites-available/date-course.kimseongmin.co.kr (2단계: 인증서 받은 뒤)
# 앱은 127.0.0.1:18290 에서만 열려 있고, nginx 가 HTTPS 를 받아 넘겨준다.
server {
    listen 80;
    listen [::]:80;
    server_name date-course.kimseongmin.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name date-course.kimseongmin.co.kr;

    ssl_certificate /etc/letsencrypt/live/date-course.kimseongmin.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/date-course.kimseongmin.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 화면 빌드 파일은 이름에 내용 해시가 붙어 있어 오래 캐시해도 된다
    location /assets/ {
        proxy_pass http://127.0.0.1:18290;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:18290;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
